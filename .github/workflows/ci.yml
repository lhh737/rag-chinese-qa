name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --extra mcp   # 含 optional extra，否则 MCP 测试会被 importorskip 静默跳过
      - name: Tests (offline, no network / no index needed)
        env:
          PYTHONUTF8: "1"
        run: uv run pytest -q
