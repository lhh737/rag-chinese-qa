[project]
name = "rag-chinese-qa"
version = "2.0.0"
description = "以评测体系为主轴的中文 RAG 质量工程：构建→评测→可见→归因→迭代→安全"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "lhh737" }]

# P0 依赖迁移（设计 §5.4）：去 langchain 全家桶（faiss-cpu 直连 / pypdf / 自研分块器）
# faiss-cpu 与 pypdf 钉在与"对照环境"一致的版本（保 parity 对照可信）
dependencies = [
    "faiss-cpu==1.13.2",
    "pypdf==6.11.0",
    "openai>=1.109.1",
    "python-dotenv>=1.0.0",
    "jieba==0.42.1",
    "rank-bm25==0.2.2",
    "numpy>=2.0",
    "PyYAML>=6.0",
    "pydantic>=2.10,<2.11",  # 上限：gradio 5.9.1 的 gradio-client 不兼容 pydantic>=2.11 的 JSON Schema 形式
    "pydantic-settings>=2.14",
    "requests>=2.31",
    "gradio==5.9.1",
]

[project.optional-dependencies]
# 本地模型模式（无 GPU 时不需要）
local = ["sentence-transformers>=3.3.1"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
ragqa = "ragqa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
