[project]
name = "rag-chinese-qa"
version = "2.0.0"
description = "中文 RAG 文档问答系统（评测主轴）：混合检索 + 重排序 + 行内引用 + 自研 Judge"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "lhh737" }]

# P0 依赖迁移（设计 §5.4）：去 langchain 全家桶（faiss-cpu 直连 / pypdf / 自研分块器）
# faiss-cpu 与 pypdf 钉在与"对照环境"一致的版本（保 parity 对照可信）
dependencies = [
    "faiss-cpu==1.13.2",
    "pypdf==6.11.0",
    "openai>=1.109.1",
    "python-dotenv>=1.0.0",
    "jieba==0.42.1",
    "rank-bm25==0.2.2",
    "numpy>=2.0",
    "PyYAML>=6.0",
    "pydantic>=2.12",  # DR-005（2026-10-16）：放开原 <2.11 上限——该上限是已移除的 gradio 遗留约束；MCP SDK v2 要求 >=2.12
    "pydantic-settings>=2.14",
    "requests>=2.31",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.20",  # FastAPI 文件上传（/documents/upload）
]

[project.optional-dependencies]
# 本地模型模式（无 GPU 时不需要）
local = ["sentence-transformers>=3.3.1"]
# MCP server（可选；核心链路不依赖，仅 `ragqa mcp` 需要）
mcp = ["mcp>=2.0"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]  # httpx：FastAPI TestClient 依赖（原由 gradio 传递引入，显式声明）

[project.scripts]
ragqa = "ragqa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
