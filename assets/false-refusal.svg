<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-labelledby="fr-title fr-desc">
<title id="fr-title">False refusal with 95% Wilson confidence intervals</title>
<desc id="fr-desc">Dot plot of the false-refusal rate across four evaluation sets, with 95% Wilson confidence intervals. Lower is better.</desc>
<rect width="860" height="360" fill="#fcfcfb"/>
<text x="64.0" y="32.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-variant-numeric="tabular-nums">False refusal with 95% Wilson CI</text>
<text x="64.0" y="52.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-variant-numeric="tabular-nums">Lower is better. Paper dev n=60; paper holdout n=20; business n=30.</text>
<line x1="140.0" y1="84" x2="140.0" y2="304" stroke="#e1e0d9" stroke-width="1"/>
<text x="140.0" y="324.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-variant-numeric="tabular-nums">0%</text>
<line x1="276.0" y1="84" x2="276.0" y2="304" stroke="#e1e0d9" stroke-width="1"/>
<text x="276.0" y="324.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-variant-numeric="tabular-nums">10%</text>
<line x1="412.0" y1="84" x2="412.0" y2="304" stroke="#e1e0d9" stroke-width="1"/>
<text x="412.0" y="324.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-variant-numeric="tabular-nums">20%</text>
<line x1="548.0" y1="84" x2="548.0" y2="304" stroke="#e1e0d9" stroke-width="1"/>
<text x="548.0" y="324.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-variant-numeric="tabular-nums">30%</text>
<line x1="684.0" y1="84" x2="684.0" y2="304" stroke="#e1e0d9" stroke-width="1"/>
<text x="684.0" y="324.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-variant-numeric="tabular-nums">40%</text>
<line x1="820.0" y1="84" x2="820.0" y2="304" stroke="#e1e0d9" stroke-width="1"/>
<text x="820.0" y="324.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-variant-numeric="tabular-nums">50%</text>
<line x1="140" y1="304" x2="820" y2="304" stroke="#c3c2b7" stroke-width="1"/>
<text x="128.0" y="115.5" font-size="12" fill="#52514e" text-anchor="end" font-weight="400" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-variant-numeric="tabular-nums">Paper dev R1</text>
<line x1="326.3" y1="111.5" x2="631.0" y2="111.5" stroke="#52514e" stroke-width="1.5"/><line x1="326.3" y1="106.5" x2="326.3" y2="116.5" stroke="#52514e" stroke-width="1.5"/><line x1="631.0" y1="106.5" x2="631.0" y2="116.5" stroke="#52514e" stroke-width="1.5"/>
<circle cx="454.2" cy="111.5" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>Paper dev R1 — 23.1% (95% CI 13.7–36.1%)</title></circle>
<text x="454.2" y="101.5" font-size="11" fill="#0b0b0b" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-variant-numeric="tabular-nums" stroke="#fcfcfb" stroke-width="3" paint-order="stroke">23.1%</text>
<text x="128.0" y="170.5" font-size="12" fill="#52514e" text-anchor="end" font-weight="400" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-variant-numeric="tabular-nums">Paper dev final</text>
<line x1="326.3" y1="166.5" x2="631.0" y2="166.5" stroke="#52514e" stroke-width="1.5"/><line x1="326.3" y1="161.5" x2="326.3" y2="171.5" stroke="#52514e" stroke-width="1.5"/><line x1="631.0" y1="161.5" x2="631.0" y2="171.5" stroke="#52514e" stroke-width="1.5"/>
<circle cx="454.2" cy="166.5" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>Paper dev final — 23.1% (95% CI 13.7–36.1%)</title></circle>
<text x="454.2" y="156.5" font-size="11" fill="#0b0b0b" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-variant-numeric="tabular-nums" stroke="#fcfcfb" stroke-width="3" paint-order="stroke">23.1%</text>
<text x="128.0" y="225.5" font-size="12" fill="#52514e" text-anchor="end" font-weight="400" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-variant-numeric="tabular-nums">Paper holdout</text>
<line x1="218.9" y1="221.5" x2="673.1" y2="221.5" stroke="#52514e" stroke-width="1.5"/><line x1="218.9" y1="216.5" x2="218.9" y2="226.5" stroke="#52514e" stroke-width="1.5"/><line x1="673.1" y1="216.5" x2="673.1" y2="226.5" stroke="#52514e" stroke-width="1.5"/>
<circle cx="367.1" cy="221.5" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>Paper holdout — 16.7% (95% CI 5.8–39.2%)</title></circle>
<text x="367.1" y="211.5" font-size="11" fill="#0b0b0b" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-variant-numeric="tabular-nums" stroke="#fcfcfb" stroke-width="3" paint-order="stroke">16.7%</text>
<text x="128.0" y="280.5" font-size="12" fill="#52514e" text-anchor="end" font-weight="400" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-variant-numeric="tabular-nums">E-commerce FAQ</text>
<line x1="289.6" y1="276.5" x2="712.6" y2="276.5" stroke="#52514e" stroke-width="1.5"/><line x1="289.6" y1="271.5" x2="289.6" y2="281.5" stroke="#52514e" stroke-width="1.5"/><line x1="712.6" y1="271.5" x2="712.6" y2="281.5" stroke="#52514e" stroke-width="1.5"/>
<circle cx="454.2" cy="276.5" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"><title>E-commerce FAQ — 23.1% (95% CI 11.0–42.1%)</title></circle>
<text x="454.2" y="266.5" font-size="11" fill="#0b0b0b" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-variant-numeric="tabular-nums" stroke="#fcfcfb" stroke-width="3" paint-order="stroke">23.1%</text>
<text x="64.0" y="344.0" font-size="10" fill="#898781" text-anchor="start" font-weight="400" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-variant-numeric="tabular-nums">Intervals are Wilson 95% CI. Holdout and business are not directly comparable to paper dev.</text>
</svg>