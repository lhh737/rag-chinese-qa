<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-label="关键结果：基线对比与消融结论">
  <title>关键结果：基线 → Holdout 验收；移除模块后的误拒率变化</title>
  <rect x="0.5" y="0.5" width="759" height="539" rx="14" fill="#fcfcfb" stroke="#e5e4e0"/>
  <g font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="30" y="32" font-size="15" font-weight="600" fill="#0b0b0b">关键结果速览（全部可回溯至 Run Registry）</text>

    <!-- ══ 面板 A：基线 vs Holdout ══ -->
    <text x="30" y="66" font-size="12.5" font-weight="600" fill="#0b0b0b">① 基线（dev 60）→ Holdout 验收（20 题 · 只跑一次）</text>
    <!-- 图例 -->
    <rect x="560" y="57" width="10" height="10" rx="2" fill="#2a78d6"/>
    <text x="575" y="66" font-size="10.5" fill="#52514e">dev 基线</text>
    <rect x="645" y="57" width="10" height="10" rx="2" fill="#eb6834"/>
    <text x="660" y="66" font-size="10.5" fill="#52514e">holdout</text>

    <!-- 网格与刻度 -->
    <g stroke="#ecece8" stroke-width="1">
      <line x1="70" y1="229" x2="735" y2="229"/>
      <line x1="70" y1="186" x2="735" y2="186"/>
      <line x1="70" y1="143" x2="735" y2="143"/>
      <line x1="70" y1="100" x2="735" y2="100"/>
    </g>
    <line x1="70" y1="272" x2="735" y2="272" stroke="#d6d5cf" stroke-width="1.5"/>
    <g font-size="10" fill="#8a897f" text-anchor="end">
      <text x="62" y="232">0.25</text>
      <text x="62" y="189">0.50</text>
      <text x="62" y="146">0.75</text>
      <text x="62" y="103">1.00</text>
    </g>

    <!-- 柱：组心 136.5 / 269.5 / 402.5 / 535.5 / 668.5；条宽 28，间距 4 -->
    <g>
      <!-- Recall@5: 0.717 / 0.800 -->
      <path d="M104.5,272 V152.7 Q104.5,148.7 108.5,148.7 H128.5 Q132.5,148.7 132.5,152.7 V272 Z" fill="#2a78d6"/>
      <path d="M140.5,272 V138.4 Q140.5,134.4 144.5,134.4 H164.5 Q168.5,134.4 168.5,138.4 V272 Z" fill="#eb6834"/>
      <text x="118.5" y="142" text-anchor="middle" font-size="10" fill="#52514e">0.717</text>
      <text x="154.5" y="128" text-anchor="middle" font-size="10" fill="#52514e">0.800</text>
      <!-- 答案正确性: 0.692 / 0.667 -->
      <path d="M237.5,272 V157.0 Q237.5,153.0 241.5,153.0 H261.5 Q265.5,153.0 265.5,157.0 V272 Z" fill="#2a78d6"/>
      <path d="M273.5,272 V161.3 Q273.5,157.3 277.5,157.3 H297.5 Q301.5,157.3 301.5,161.3 V272 Z" fill="#eb6834"/>
      <text x="251.5" y="146" text-anchor="middle" font-size="10" fill="#52514e">0.692</text>
      <text x="287.5" y="151" text-anchor="middle" font-size="10" fill="#52514e">0.667</text>
      <!-- 忠实度: 0.981 / 1.000 -->
      <path d="M370.5,272 V107.3 Q370.5,103.3 374.5,103.3 H394.5 Q398.5,103.3 398.5,107.3 V272 Z" fill="#2a78d6"/>
      <path d="M406.5,272 V104.0 Q406.5,100.0 410.5,100.0 H430.5 Q434.5,100.0 434.5,104.0 V272 Z" fill="#eb6834"/>
      <text x="384.5" y="97" text-anchor="middle" font-size="10" fill="#52514e">0.981</text>
      <text x="420.5" y="93" text-anchor="middle" font-size="10" fill="#52514e">1.000</text>
      <!-- 引用准确性: 0.923 / 1.000 -->
      <path d="M503.5,272 V117.2 Q503.5,113.2 507.5,113.2 H527.5 Q531.5,113.2 531.5,117.2 V272 Z" fill="#2a78d6"/>
      <path d="M539.5,272 V104.0 Q539.5,100.0 543.5,100.0 H563.5 Q567.5,100.0 567.5,104.0 V272 Z" fill="#eb6834"/>
      <text x="517.5" y="107" text-anchor="middle" font-size="10" fill="#52514e">0.923</text>
      <text x="553.5" y="93" text-anchor="middle" font-size="10" fill="#52514e">1.000</text>
      <!-- 误拒率(越低越好): 0.231 / 0.167 -->
      <path d="M636.5,272 V236.3 Q636.5,232.3 640.5,232.3 H660.5 Q664.5,232.3 664.5,236.3 V272 Z" fill="#2a78d6"/>
      <path d="M672.5,272 V247.3 Q672.5,243.3 676.5,243.3 H696.5 Q700.5,243.3 700.5,247.3 V272 Z" fill="#eb6834"/>
      <text x="650.5" y="226" text-anchor="middle" font-size="10" fill="#52514e">0.231</text>
      <text x="686.5" y="237" text-anchor="middle" font-size="10" fill="#52514e">0.167</text>
    </g>

    <!-- 组标签 -->
    <g font-size="11" fill="#52514e" text-anchor="middle">
      <text x="136.5" y="290">Recall@5</text>
      <text x="269.5" y="290">答案正确性</text>
      <text x="402.5" y="290">忠实度</text>
      <text x="535.5" y="290">引用准确性</text>
      <text x="668.5" y="290">误拒率 ★</text>
    </g>
    <text x="30" y="308" font-size="9.5" fill="#8a897f">★ 误拒率越低越好（其余越高越好）；judge 指标为冻结版裁判（P4 v1.1，164 条盲标校准）</text>

    <!-- ══ 面板 B：消融 ══ -->
    <text x="30" y="340" font-size="12.5" font-weight="600" fill="#0b0b0b">② 移除模块 / 对照实验后的误拒率变化（pp；正值 = 恶化）</text>
    <g font-size="11" fill="#52514e" text-anchor="end">
      <text x="252" y="367.5">A1 · 移除重排 ★</text>
      <text x="252" y="391.5">I3 · prompt v2 ★</text>
      <text x="252" y="415.5">I2 · TopK 上调</text>
      <text x="252" y="439.5">A4b · merge 融合</text>
      <text x="252" y="463.5">A3 · 纯稠密（−BM25）</text>
      <text x="252" y="487.5">A2 · 关闭 HyDE</text>
    </g>
    <g font-size="10" fill="#52514e">
      <!-- A1: 13.5pp, 显著 -->
      <path d="M260,356 H629.5 Q633.5,356 633.5,360 V368 Q633.5,372 629.5,372 H260 Z" fill="#e34948"/>
      <text x="641.5" y="367.5">13.5 pp</text>
      <!-- I3: 13.5pp, 显著 -->
      <path d="M260,380 H629.5 Q633.5,380 633.5,384 V392 Q633.5,396 629.5,396 H260 Z" fill="#e34948"/>
      <text x="641.5" y="391.5">13.5 pp</text>
      <!-- I2: 9.6pp -->
      <path d="M260,404 H521.6 Q525.6,404 525.6,408 V416 Q525.6,420 521.6,420 H260 Z" fill="#2a78d6"/>
      <text x="533.6" y="415.5">9.6 pp</text>
      <!-- A4b: 9.6pp -->
      <path d="M260,428 H521.6 Q525.6,428 525.6,432 V440 Q525.6,444 521.6,444 H260 Z" fill="#2a78d6"/>
      <text x="533.6" y="439.5">9.6 pp</text>
      <!-- A3: 7.7pp -->
      <path d="M260,452 H469.0 Q473.0,452 473.0,456 V464 Q473.0,468 469.0,468 H260 Z" fill="#2a78d6"/>
      <text x="481.0" y="463.5">7.7 pp</text>
      <!-- A2: 0.0 -->
      <path d="M260,476 H261.5 Q263.5,476 263.5,478 V490 Q263.5,492 261.5,492 H260 Z" fill="#2a78d6"/>
      <text x="271.5" y="487.5">0.0 pp（无变化）</text>
    </g>
    <text x="30" y="516" font-size="10" fill="#8a897f">★ 统计显著（逐题配对 McNemar，p=0.023 / p=0.045）；其余为方向性差异。对照运行共 10+ 个（P5–P6）；红线仅表示"显著恶化"状态，非独立系列。</text>
  </g>
</svg>
